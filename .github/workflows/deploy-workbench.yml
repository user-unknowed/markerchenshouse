name: Deploy Cat Daily (Workbench) to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'workbench/**'
      - '.github/workflows/deploy-workbench.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-workbench"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy workbench/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./workbench
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore(pages): deploy workbench ${{ github.sha }}'
          force_orphan: false
