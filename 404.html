<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>版面走丢 · 喵生编辑部 / Marker Chen 小站</title>
<meta name="theme-color" content="#f5efde" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23f5efde' stroke='%23c4651e' stroke-width='1.5'/><path d='M10 21 Q9 12 16 12 Q23 12 22 21 Z' fill='%23c4651e'/><path d='M9 12 L8 7 L13 11 M23 12 L24 7 L19 11' fill='none' stroke='%23c4651e' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/><circle cx='13.5' cy='18' r='1.3' fill='%233a2e1f'/><circle cx='18.5' cy='18' r='1.3' fill='%233a2e1f'/><path d='M15 19.8 Q16 20.8 17 19.8' fill='none' stroke='%233a2e1f' stroke-width='1.2' stroke-linecap='round'/></svg>" />
<style>
  :root {
    --page-bg:#f5efde; --surface-card:#fcf6e6; --surface-nested:#f1e9d2;
    --border:#d9cca8; --border-input:#c4b48a;
    --text:#4a3826; --text-secondary:#7a6444; --text-tertiary:#8a7553;
    --accent:#c4651e; --accent-muted:#f3e3c8; --on-accent:#fcf6e6;
    --module-4:#b5482e; --module-1:#4a6b3e;
    --font-serif: Georgia, "Times New Roman", "Songti SC", "STSong", serif;
    --font: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --radius-card:16px; --radius-tile:12px;
    --shadow-card: 0 1px 2px rgba(74,56,38,.06), 0 4px 16px rgba(74,56,38,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:var(--font);
    background:var(--page-bg);
    background-image:
      radial-gradient(circle at 20% 30%, rgba(196,101,30,.06) 0 2px, transparent 3px),
      radial-gradient(circle at 70% 60%, rgba(74,107,62,.05) 0 1.5px, transparent 2.5px),
      radial-gradient(circle at 40% 80%, rgba(196,101,30,.05) 0 1.5px, transparent 2.5px),
      repeating-linear-gradient(45deg, rgba(74,56,38,.025) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(-45deg, rgba(74,56,38,.02) 0 1px, transparent 1px 5px);
    min-height:100vh;color:var(--text);
    display:flex;align-items:center;justify-content:center;
    padding:24px;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background-image:
      repeating-linear-gradient(0deg, rgba(74,56,38,.025) 0 1px, transparent 1px 24px),
      repeating-linear-gradient(90deg, rgba(74,56,38,.02) 0 1px, transparent 1px 24px);
    mix-blend-mode:multiply;
  }
  .wrap{
    position:relative;max-width:680px;width:100%;
    background:var(--surface-card);border:4px double var(--border-input);
    border-radius:var(--radius-card);padding:56px 48px 48px;
    box-shadow:var(--shadow-card);
  }
  .stamp{
    position:absolute;top:-18px;left:32px;
    font-family:var(--font-serif);font-weight:700;font-size:12px;
    letter-spacing:.2em;color:var(--module-4);
    border:1.5px dashed var(--module-4);border-radius:2px;
    padding:4px 10px;background:rgba(252,246,230,.9);transform:rotate(-3deg);
  }
  .tape{
    position:absolute;top:-10px;right:40px;width:70px;height:20px;
    background:linear-gradient(180deg, rgba(217,121,53,.55), rgba(217,121,53,.38));
    border-left:1px dashed rgba(74,56,38,.22);border-right:1px dashed rgba(74,56,38,.22);
    transform:rotate(4deg);
  }
  .code{
    font-family:var(--font-serif);font-style:italic;font-size:14px;
    color:var(--text-secondary);letter-spacing:.15em;margin-bottom:8px;
  }
  h1{
    font-family:var(--font-serif);font-size:52px;line-height:1.05;
    color:var(--text);margin-bottom:12px;
  }
  h1 em{color:var(--accent);font-style:italic;}
  .sub{
    font-family:var(--font-serif);font-style:italic;font-size:17px;
    color:var(--text-secondary);margin-bottom:12px;line-height:1.7;
  }
  .sub-hint{
    font-size:14px;color:var(--text-tertiary);line-height:1.7;
    font-family:var(--font-serif);font-style:italic;margin-bottom:28px;
  }
  .cat{
    width:140px;height:84px;margin:12px 0 28px;opacity:.82;
  }
  .divider{
    height:2px;background:repeating-linear-gradient(90deg, var(--text-tertiary) 0 4px, transparent 4px 9px);
    margin:28px 0 26px;
  }
  .panel-title{
    font-family:var(--font-serif);font-size:13px;font-weight:700;
    letter-spacing:.2em;color:var(--module-1);text-transform:uppercase;
    margin-bottom:14px;
  }
  .destinations{
    display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:24px;
  }
  .dest{
    display:flex;flex-direction:column;gap:8px;
    padding:20px 20px 18px;border-radius:var(--radius-tile);
    background:var(--surface-nested);border:1px dashed var(--border-input);
    text-decoration:none;color:inherit;transition:transform .15s, box-shadow .15s, background .2s;
    position:relative;
  }
  .dest:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(74,56,38,.12);background:var(--accent-muted);}
  .dest .label{font-family:var(--font-serif);font-style:italic;font-size:12px;color:var(--text-secondary);letter-spacing:.1em;}
  .dest .name{font-size:18px;font-weight:700;color:var(--text);font-family:var(--font-serif);}
  .dest .desc{font-size:12.5px;color:var(--text-secondary);line-height:1.6;}
  .dest .arrow{position:absolute;top:16px;right:16px;color:var(--accent);}
  .btn-row{display:flex;flex-wrap:wrap;gap:12px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;
    font-family:var(--font-serif);font-weight:600;font-size:15px;
    background:var(--accent);color:var(--on-accent);
    border:1.5px solid var(--accent);border-radius:var(--radius-tile);
    padding:12px 24px;text-decoration:none;cursor:pointer;
    transition:transform .15s, box-shadow .15s;
    box-shadow:0 2px 6px rgba(196,101,30,.25);
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(196,101,30,.35);}
  .btn.sec{background:var(--surface-nested);color:var(--text);border-color:var(--border-input);box-shadow:none;}
  .btn.sec:hover{background:var(--accent-muted);}
  .foot{
    margin-top:32px;padding-top:20px;border-top:1px dashed var(--border);
    font-family:var(--font-serif);font-style:italic;font-size:13px;color:var(--text-tertiary);
    text-align:center;letter-spacing:.08em;
  }
  @media (max-width:560px){
    .wrap{padding:48px 24px 32px;}
    h1{font-size:38px;}
    .destinations{grid-template-columns:1fr;}
    .stamp{left:16px;}
    .tape{right:20px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <span class="stamp">LOST · 404 · 版面寻回中</span>
  <span class="tape"></span>
  <div class="code">THE CAT DAILY × Marker Chen · 喵生号外</div>
  <h1><em>糟糕！</em><br/>这个版面被猫咪藏起来了。</h1>
  <div class="sub">
    可能是橘座把这一页抓去磨爪子了，<br/>
    也可能是墨绿小编把它叠在了纸盒子下面。
  </div>
  <div class="sub-hint">
    本站有两个目的地，请选一个继续你的旅程 ↓
  </div>

  <svg class="cat" viewBox="0 0 140 84" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M24 62 Q26 38 52 38 L88 38 Q114 38 116 62" stroke="#c4651e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M38 38 L32 16 L52 32" stroke="#c4651e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M102 38 L108 16 L88 32" stroke="#c4651e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="56" cy="50" rx="4" ry="5" fill="#4a3826"/><ellipse cx="84" cy="50" rx="4" ry="5" fill="#4a3826"/>
    <path d="M66 58 Q70 64 74 58" stroke="#4a3826" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M116 62 Q130 66 134 76" stroke="#c4651e" stroke-width="3" stroke-linecap="round"/>
    <path d="M24 62 Q10 66 6 76" stroke="#c4651e" stroke-width="3" stroke-linecap="round"/>
    <path d="M62 62 L62 70 M70 62 L70 70 M78 62 L78 70" stroke="#c4651e" stroke-width="2.8" stroke-linecap="round"/>
    <circle cx="56" cy="50" r="7.5" fill="none" stroke="#b5482e" stroke-width="1.6" stroke-dasharray="2 2"/>
    <circle cx="84" cy="50" r="7.5" fill="none" stroke="#b5482e" stroke-width="1.6" stroke-dasharray="2 2"/>
    <path d="M44 44 L40 42 M100 44 L96 42 M54 56 L50 57 M86 56 L90 57" stroke="#c4651e" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>
  </svg>

  <div class="divider"></div>

  <div class="panel-title">— 请选择目的地 —</div>
  <div class="destinations">
    <a class="dest" href="/markerchenshouse/" aria-label="Marker Chen 博客首页">
      <div class="label">BLOG · 博客主站</div>
      <div class="name">Marker Chen 的小站</div>
      <div class="desc">文章、标签、关于我。<br/>在这里读文字、看生活。</div>
      <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </a>
    <a class="dest" href="/markerchenshouse/workbench/" aria-label="喵生编辑部工作台">
      <div class="label">WORKBENCH · 工作台</div>
      <div class="name">喵生编辑部</div>
      <div class="desc">打卡、待办、记账、日程。<br/>每天一份手写的喵生日报。</div>
      <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </a>
  </div>

  <div class="btn-row">
    <a class="btn" href="javascript:history.back()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
      返回上一版
    </a>
  </div>

  <div class="foot">— 喵生编辑部 · 找版启示 · 请联系橘座或小编 —</div>
</div>
</body>
</html>
